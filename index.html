<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b1020">
  <title>Happy Birthday Shivani ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="preview-bar">
    <button id="backBtn" class="back-btn" type="button" disabled>‹ Back</button>
    <div class="preview-center">
      <span class="preview-pill">♥ PREVIEW MODE</span>
      <span id="stepCount" class="step-count">1 / 7</span>
    </div>
    <button id="restartBtn" class="restart-btn" type="button" aria-label="Restart">↻</button>
  </header>

  <main class="experience">
    <iframe id="pageFrame" title="Shivani birthday experience" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </main>

  <button id="nextBtn" class="next-btn" type="button" hidden>Continue <span>→</span></button>

  <script src="script.js"></script>
</body>
</html>
